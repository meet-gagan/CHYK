<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Official Course Route Map • Anti-Drug Movement Marathon 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07162D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px 20px;
      background: #0D1E3A;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title-box h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #FFFFFF;
    }
    .title-box p {
      font-size: 0.8rem;
      color: #94A3B8;
      margin-top: 2px;
    }
    .btn-maps {
      background: linear-gradient(135deg, #F0441D, #FFD12D);
      color: #07162D;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 9999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(240, 68, 29, 0.35);
      transition: transform 0.2s ease;
    }
    .btn-maps:hover {
      transform: scale(1.03);
    }
    .map-container {
      flex: 1;
      width: 100%;
      min-height: 80vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      min-height: 80vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>Anti-Drug Marathon 2026 • Official Route</h1>
      <p>Municipal High School ➔ Gosha Hospital ➔ Chinmaya Mission, Adoni</p>
    </div>
    <a href="https://maps.app.goo.gl/aBVcfaNbbFJTNvmX9?g_st=aw" target="_blank" rel="noopener noreferrer" class="btn-maps">
      Open in Google Maps App ↗
    </a>
  </div>
  <div class="map-container">
    <iframe
      src="https://maps.google.com/maps?saddr=Municipal%20High%20School%2C%20Adoni&daddr=Gosha%20Hospital%20Govt.Hospital%20Adoni%20to%3AChinmaya%20Mission%2C%20Adoni&t=&z=14&ie=UTF8&iwloc=&output=embed"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Anti-Drug Marathon Route"
    ></iframe>
  </div>
</body>
</html>
